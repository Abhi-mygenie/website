server {
    listen 80;
    server_name mygenie.online www.mygenie.online;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name mygenie.online www.mygenie.online;
    root /var/www/website/frontend/build;
    index index.html;
    client_max_body_size 100M;
    # ============================================================
    # 301 REDIRECTS - OLD URLs → NEW V2.4 URLs
    # ============================================================
    rewrite ^/fine-dining$                  /solutions/restaurants        permanent;
    rewrite ^/quick-service$                /solutions/qsr                permanent;
    rewrite ^/Cafe-and-coffee-shop$         /solutions/cafes              permanent;
    rewrite ^/cloud-kithen$                 /solutions/cloud-kitchens     permanent;
    rewrite ^/bar-and-pubs$                 /solutions/bars-pubs          permanent;
    rewrite ^/bakeries$                     /solutions/bakeries           permanent;
    rewrite ^/buffet-stations-restaurant$   /solutions/food-courts        permanent;
    rewrite ^/ice-green-and-dessert$        /solutions/ice-cream-desserts permanent;
    rewrite ^/pizzerias$                    /solutions/restaurants        permanent;
    rewrite ^/smart-billing$                /product/sell-serve           permanent;
    rewrite ^/inventory-management$         /product/protect-profit       permanent;
    rewrite ^/reports_and-analytics$        /product/see-everything       permanent;
    rewrite ^/menu-management$              /product/sell-serve           permanent;
    rewrite ^/about-us$                     /about                        permanent;
    rewrite ^/contact-us$                   /contact                      permanent;
    rewrite ^/terms-and-conditions$         /terms                        permanent;
    rewrite ^/privacy-policy$               /privacy                      permanent;
    rewrite ^/refund-policy$                /refund                       permanent;
    rewrite ^/blogs$                        /blog                         permanent;
    # ============================================================
    # SSL
    # ============================================================
    ssl_certificate /etc/letsencrypt/live/mygenie.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mygenie.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ============================================================
    # SECURITY HEADERS
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    # ============================================================
    # FASTAPI BACKEND
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # ============================================================
    # STATIC FILES
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
    # ============================================================
    # FAVICON
    # ============================================================
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }
    # ============================================================
    # ROBOTS
    # ============================================================
    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }
    # ============================================================
    # SITEMAP
    # ============================================================
    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }
    # ============================================================
    # CUSTOM 404 PAGE
    # ============================================================
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }
    # ============================================================
    # PRERENDERED REACT ROUTES
    # ============================================================
    location / {
        try_files $uri $uri/index.html =404;
    }
    # ============================================================
    # LOGS
    # ============================================================
    access_log /var/log/nginx/mygenie_access.log;
    error_log /var/log/nginx/mygenie_error.log;
}
